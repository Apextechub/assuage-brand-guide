# Builds and deploys the site to Cloudflare Workers on every push to main.
#
# This is what makes one-click publishing work: the content admin commits to
# this branch, which triggers this workflow, which puts the change live. Without
# it, publishing would only reach the repository.
#
# Required secrets, on the "Assuage1" environment
# (Settings → Environments → Assuage1 → Environment secrets):
#   CLOUDFLARE_API_TOKEN   token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard URL or Workers overview
#
# Runtime secrets (ADMIN_SESSION_SECRET, ADMIN_PASSWORD_HASH, GITHUB_TOKEN) are
# NOT set here — they live on the Worker itself via `wrangler secret put`, and
# survive deploys. See docs/content-admin.md.
#
# Note: the admin publishes using a personal access token, and pushes made with
# a PAT *do* trigger workflows. (Pushes made with the built-in Actions token do
# not, which is what stops a deploy from re-triggering itself.)

name: Deploy

on:
  push:
    branches: [main]
  # Lets you redeploy without pushing, from the Actions tab.
  workflow_dispatch:

# A newer push should win rather than racing an in-flight deploy.
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are environment secrets,
    # not repository secrets. This name must match the environment in
    # Settings → Environments exactly — GitHub silently creates a new, empty
    # environment when it does not, and every secret then resolves to empty
    # with "necessary to set a CLOUDFLARE_API_TOKEN environment variable".
    environment: Assuage1
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `npm ci` needs package-lock.json committed, which is worth doing for
      # reproducible builds. Fall back so a fresh checkout still deploys.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --config .output/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
